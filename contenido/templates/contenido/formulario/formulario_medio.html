{% extends 'contenido/base.html' %}

{% block contenido %}

{% if object %}
        <h1>Editar Medio</h1>
    {% else %}
        <h1>Crear Medio</h1>
    {% endif %}

    <form class="card card-body mb-3" method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Guardar</button>
        <a href="{% url 'lista_medios' %}">Cancelar</a>
    </form>

{% endblock %}
