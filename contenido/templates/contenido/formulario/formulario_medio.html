<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Medio - CiberDuo</title>
</head>
<body>

    {% if object %}
        <h1>Editar Medio</h1>
    {% else %}
        <h1>Crear Medio</h1>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Guardar</button>
        <a href="{% url 'lista_medios' %}">Cancelar</a>
    </form>
    
</body>
</html>
