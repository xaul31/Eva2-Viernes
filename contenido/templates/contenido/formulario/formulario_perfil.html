{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="{% static 'contenido/estilos.css' %}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Perfil - CiberDuo</title>
</head>
<body>

    {% if object %}
        <h1>Editar Perfil</h1>
    {% else %}
        <h1>Crear Nuevo Perfil</h1>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Guardar</button>
        <a href="{% url 'lista_perfiles' %}">Cancelar</a>
    </form>

</body>
</html>
