{% extends 'contenido/base.html' %}

{% block contenido %}

<h1>Eliminar Medio</h1>

    <p>¿Estás seguro de que deseas eliminar el medio "{{ medio.nombre }}"?</p>

    <form class="card card-body mb-3" method="POST">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Sí, eliminar</button>
        <a href="{% url 'lista_medios' %}">Cancelar</a>
    </form>

{% endblock %}
