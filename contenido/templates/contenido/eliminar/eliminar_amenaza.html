{% extends 'contenido/base.html' %}

{% block contenido %}

<h1>Eliminar Amenaza</h1>
    <p>¿Estás seguro de que quieres eliminar esta amenaza?{{ object.nombre }}</p>
    <form class="card card-body mb-3" method="POST">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Sí, eliminar</button>
        <a href="{% url 'lista_amenazas' %}">Cancelar</a>
    </form>

{% endblock %}
