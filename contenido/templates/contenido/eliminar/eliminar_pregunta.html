{% extends 'contenido/base.html' %}

{% block contenido %}

<h1>Eliminar pregunta</h1>

    <p>¿Estás seguro de eliminar esta pregunta?</p>

    <p><strong>{{ object.enunciado }}</strong></p>

    <form class="card card-body mb-3" method="post">
        {% csrf_token %}

        <button class="btn btn-danger" type="submit">Sí, eliminar</button>

        <a href="{% url 'lista_preguntas' %}">
            Cancelar
        </a>
    </form>

{% endblock %}
