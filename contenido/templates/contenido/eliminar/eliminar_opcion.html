{% extends 'contenido/base.html' %}

{% block contenido %}

<h1>Eliminar Opción</h1>
    <p>¿Estás seguro de que deseas eliminar la opción "{{ object.texto }}"?</p>

    <form class="card card-body mb-3" method="POST">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Confirmar eliminación</button>
        <a href="{% url 'lista_opciones' %}">Cancelar</a>
    </form>

{% endblock %}
