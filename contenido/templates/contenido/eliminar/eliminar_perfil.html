{% extends 'contenido/base.html' %}

{% block contenido %}

<h1>Eliminar Perfil</h1>

    <p>¿Estás seguro de que deseas eliminar el perfil "{{ object.nombre }}"?</p>

    <form class="card card-body mb-3" method="POST">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Confirmar Eliminación</button>
        <a href="{% url 'lista_perfiles' %}">Cancelar</a>
    </form>

{% endblock %}
