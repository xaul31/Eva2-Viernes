<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Amenaza - CiberDuo</title>
</head>
<body>
    <h1>Eliminar Amenaza</h1>
    <p>¿Estás seguro de que quieres eliminar esta amenaza?</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
        <a href="{% url 'lista_amenazas' %}">Cancelar</a>
    </form>
</body>
</html>
