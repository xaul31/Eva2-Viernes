<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Medio - CiberDuo</title>
</head>
<body>

    <h1>Eliminar Medio</h1>

    <p>¿Estás seguro de que deseas eliminar el medio "{{ medio.nombre }}"?</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
        <a href="{% url 'lista_medios' %}">Cancelar</a>
    </form>
    
</body>
</html>
